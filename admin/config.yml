backend:
  name: git-gateway
  branch: main

media_folder: images
public_folder: /images

collections:
  - name: posts
    label: Posts
    folder: posts
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string
      - name: date
        label: Date
        widget: datetime
      - name: body
        label: Body
        widget: markdown